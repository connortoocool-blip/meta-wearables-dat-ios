name: Build Meta CameraAccess

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Build CameraAccess for iPhone
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER=com.connorarnold.aurorapresence.cameraaccess \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/CameraAccess.app Payload/
          zip -r CameraAccess-unsigned.ipa Payload

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-iPhone
          path: CameraAccess-unsigned.ipa
